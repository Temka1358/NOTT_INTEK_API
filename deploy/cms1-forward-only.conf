# cms1 — PHASE A of the cutover: cms1's public site runs NO PHP any more and
# forwards every request to the new server over the LAN.
#
# Why: boxes cache DNS (often until reboot), so moving the DNS record alone
# leaves some boxes on cms1's PHP for days. With this in place every box is on
# the new code at once, cms1's PHP is unreachable from the internet, and
# cms1's TLS (the handshake the fleet already does) is unchanged.
#
# Install on cms1 (nginx 1.10):
#   cp /etc/nginx/sites-available/nott_ssl /root/nott_ssl.php-backup
#   cp cms1-forward-only.conf /etc/nginx/sites-available/nott_ssl
#   nginx -t && nginx -s reload
# Rollback (back to PHP):
#   cp /root/nott_ssl.php-backup /etc/nginx/sites-available/nott_ssl && nginx -t && nginx -s reload
#
# This is CUTOVER.md step 18. Then PHASE B (step 19): move the cms.ddishtv.mn A record.
# PHASE C (step 20): when this vhost's access log shows no box requests for a few days,
# close 443 on cms1 entirely (edge firewall/NAT and on cms1).

server {
    listen 443;
    ssl on;
    server_name cms.ddishtv.mn;
    server_tokens off;

    # ---- TLS: unchanged from the live nott_ssl (nginx -T, 2026-10-23)
    ssl_certificate /etc/ssl/cert_26/star_ddishtv_mn.pem;
    ssl_certificate_key /etc/ssl/cert_26/ddishtv_mn.key;
    ssl_protocols TLSv1.2;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;

    # Smaller log: no query strings (they carry tokens). Use it to watch
    # traffic drain away after the DNS move.
    access_log /var/log/nginx/nginx.vhost.access.log;
    error_log  /var/log/nginx/nginx.vhost.error.log;

    location / {
        # The new server's LAN address, over https: it serves these endpoints on
        # 443 only, and this hop carries tokens and purchase requests. The new
        # server's ufw must allow 443 from 192.168.10.23 (CUTOVER.md step 4);
        # test first with step 17d.
        proxy_pass https://NEW_SERVER_LAN_IP;      # e.g. https://192.168.10.30
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host cms.ddishtv.mn;
        proxy_ssl_server_name on;
        proxy_ssl_name cms.ddishtv.mn;
        # The box's real address, for the rate limits and the ISP check. The
        # new server trusts this header from 192.168.10.23 only.
        proxy_set_header X-NOTT-Client-IP $remote_addr;
        # The box's own X-Forwarded-For / Client-IP headers pass through
        # unchanged (nginx forwards request headers by default), as PHP read them.
        proxy_read_timeout 60s;
        proxy_next_upstream off;    # a timed-out cdn.php may already have billed
    }
}

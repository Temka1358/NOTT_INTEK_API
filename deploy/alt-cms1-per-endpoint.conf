# ALTERNATIVE to deploy/new-server: per-endpoint cutover of cms.ddishtv.mn from PHP-FPM on cms1
# to nott-intek-api on cms2.
#
# Add the upstream at http{} level and the location blocks INSIDE the existing
# `server { listen 443; server_name cms.ddishtv.mn; ... }` in nott_ssl.
# `location = /x.php` (exact match) wins over the existing `location ~ \.php$`,
# so each block moves exactly one script; everything else on the vhost
# (posters under /cms/, 404.html, phpmyadmin) keeps working untouched.
#
# Cut over one endpoint at a time, least risky first:
#   1. metaData.php    read-only
#   2. userinfo.php    resets the daily quota at day change; calls xvod (read)
#   3. tokenServer.php token rotation + CAS push — watch token issuance
#   4. cdn.php         quota counting + BILLING — watch the billing log
# Rollback for any step: comment its block out, `nginx -t && nginx -s reload`.
# Do not add an automatic fallback to PHP on 5xx: a timed-out cdn.php request
# may already have billed, and replaying it would bill twice.

upstream nott_intek {
    server 192.168.10.X:8090;   # cms2 (LAN). Firewall this port to cms1 only.
    keepalive 16;
}

# --- shared proxy settings (paste once, or repeat inside each location) ---
#   proxy_http_version 1.1;
#   proxy_set_header Connection "";
#   proxy_set_header Host $host;
#   # REMOTE_ADDR as PHP saw it. Overwrites any client-supplied X-Real-IP.
#   proxy_set_header X-Real-IP $remote_addr;
#   # PHP read the CLIENT's X-Forwarded-For / Client-IP verbatim (getUserIP).
#   # Pass them through unchanged — do NOT use $proxy_add_x_forwarded_for,
#   # which appends and would change ISP detection.
#   proxy_set_header X-Forwarded-For $http_x_forwarded_for;
#   proxy_set_header Client-IP $http_client_ip;
#   # cdn.php response can make two 10 s upstream calls (ordernOTT + billing)
#   proxy_read_timeout 60s;

location = /nott/metaData.php {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header Client-IP $http_client_ip;
    proxy_read_timeout 60s;
    proxy_pass http://nott_intek;
}

# location = /nott/userinfo.php    { ...same block... proxy_pass http://nott_intek; }
# location = /nott/tokenServer.php { ...same block... proxy_pass http://nott_intek; }
#   Note: `index ... tokenServer.php` means GET /nott/ may internally redirect to
#   /nott/tokenServer.php if /var/www/html/nott/index.html does not exist. That redirect
#   lands in this block too, which is correct.

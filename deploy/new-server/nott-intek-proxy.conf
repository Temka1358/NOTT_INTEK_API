# /etc/nginx/snippets/nott-intek-proxy.conf
# Included by every location that hands a request to the Node service
# (cms.ddishtv.mn.conf and cms-lan-callback.conf). Install root:root 644.

proxy_pass http://nott_intek;               # the upstream block in cms.ddishtv.mn.conf (127.0.0.1:8090)
proxy_http_version 1.1;                     # needed for keepalive to the upstream
proxy_set_header Connection "";
proxy_set_header Host $host;

# REMOTE_ADDR as PHP saw it. Overwrites any X-Real-IP the client sent. Behind
# cms1 (Phase A) $remote_addr is already the box's address, restored by
# real_ip_header X-NOTT-Client-IP in the site config.
proxy_set_header X-Real-IP $remote_addr;

# PHP read the CLIENT's own X-Forwarded-For / Client-IP headers verbatim (the
# ISP check). Pass them through unchanged; never $proxy_add_x_forwarded_for.
proxy_set_header X-Forwarded-For $http_x_forwarded_for;
proxy_set_header Client-IP $http_client_ip;

# cdn.php request=response can make two 10 s upstream calls (ordernOTT + billing).
proxy_read_timeout 60s;
# No automatic retry: a timed-out cdn.php may already have billed.
proxy_next_upstream off;

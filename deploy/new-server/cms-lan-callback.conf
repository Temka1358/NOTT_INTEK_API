# CDN -> CMS download-authorization callback on the NEW server.
#
# On cms1 the Intek CDN nodes call  http://<cms1>/cms_cdn.php?token=...
# (vhost cms_core: port 80, root /var/www/cms, LAN only). Same here: only the
# LAN can reach it, and it is NOT exposed on the public cms.ddishtv.mn vhost.
#
# If the new CMS already has a LAN server block on port 80, paste just the
# `location = /cms_cdn.php` block into it instead of adding this server.
#
# Cutover for this path is NOT the DNS move: the CDNs reach it by whatever
# URL their cdn_cms.php has (send one CDN's cdn_cms.php to confirm). Point
# them at the new server one node at a time; cms1 keeps answering the rest.

server {
    listen 192.168.10.X:80;           # new server's LAN address
    server_name _;
    server_tokens off;

    location = /cms_cdn.php {
        allow 192.168.10.0/24;        # same allow list as cms1's cms_core
        deny  all;
        include snippets/nott-intek-proxy.conf;
    }

    location / { return 404; }
}

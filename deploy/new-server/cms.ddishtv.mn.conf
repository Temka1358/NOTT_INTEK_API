# cms.ddishtv.mn on the NEW server — the whole public face of the Intek CMS.
#
# After cutover nothing public reaches cms1 (its PHP has known security
# problems), so this server answers EVERYTHING on this hostname itself:
#   * the four STB endpoints              -> nott-intek-api (Node) on this host
#   * posters /cms/posters/<id>.png       -> static files on this host, synced
#                                            from cms1 over the LAN (poster-sync)
#   * anything else                       -> 404, byte-identical to cms1's page
# The box must not be able to tell the difference from cms1, so the TLS offer,
# the poster headers and the 404 page all match cms1 as measured 2026-10-23.
#
# Install: /etc/nginx/sites-available/cms.ddishtv.mn + symlink, plus
#          snippets/nott-intek-proxy.conf (bottom of this file). nginx -t, reload.
# Before moving DNS: scripts/tls-compare.sh <cms1-ip> <new-ip> must report 0.

upstream nott_intek {
    server 127.0.0.1:8090;
    keepalive 16;
}

# Intek boxes put their token in the query string. cms1 logged every one of
# them for 22 months. Log the query with the token value replaced instead.
map $args $nott_args_redacted {
    "~^(?<pre>.*\btoken=)[^&]*(?<post>.*)$"  "${pre}REDACTED${post}";
    default                                  $args;
}
log_format nott_redacted '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri?$nott_args_redacted $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    # default_server: on cms1 this is the ONLY server on 443, so a box whose
    # TLS stack sends no SNI still lands here. Keep it the default even if
    # this machine later hosts other 443 sites.
    listen 443 ssl default_server;      # no http2: cms1 never offered h2
    server_name cms.ddishtv.mn;
    server_tokens off;                  # as cms1's nginx.conf
    # Keep `gzip on;` with default gzip_types in nginx.conf, as on cms1:
    # tokenServer answers text/html, which nginx gzips when the box asks.

    # ---- TLS: as LOADED on cms1 (`nginx -T`, 2026-10-23): TLS 1.2, ECDHE +
    # AEAD only. Do not "modernise" before the fleet's TLS floor is measured
    # (see cdn2-tls-incident.md).
    ssl_certificate     /etc/ssl/cert_26/star_ddishtv_mn.pem;
    ssl_certificate_key /etc/ssl/cert_26/ddishtv_mn.key;
    ssl_protocols TLSv1.2;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;
    # nginx 1.10 (cms1) defaults to the P-256 curve only; pin it so the
    # handshake is the one boxes already do.
    ssl_ecdh_curve prime256v1;
    # If tls-compare.sh shows a combination cms1 accepts and this server
    # refuses (OpenSSL 3 rejects SHA-1 handshake signatures at its default
    # level), append :@SECLEVEL=0 to ssl_ciphers and re-run it.

    # Phase A of the cutover: cms1 forwards boxes here (deploy/cms1-forward-only.conf)
    # and states each box's address in X-NOTT-Client-IP. Trust that header from
    # cms1 ONLY, so the rate limits and the ISP check see the box, not cms1.
    set_real_ip_from 192.168.10.23;
    real_ip_header   X-NOTT-Client-IP;

    access_log /var/log/nginx/cms.ddishtv.mn.access.log nott_redacted;
    error_log  /var/log/nginx/cms.ddishtv.mn.error.log;

    root /var/www/cms.ddishtv.mn;       # holds cms/posters/<id>.png

    # Every 404 on this host uses the exact page cms1's nginx 1.10 sends
    # (162 bytes, text/html). Newer nginx prints a slightly different one.
    error_page 404 @cms1_404;
    location @cms1_404 {
        default_type text/html;
        return 404 "<html>\r\n<head><title>404 Not Found</title></head>\r\n<body bgcolor=\"white\">\r\n<center><h1>404 Not Found</h1></center>\r\n<hr><center>nginx</center>\r\n</body>\r\n</html>\r\n";
    }

    # ---- the four STB endpoints (exact match wins over everything below)
    location = /nott/tokenServer.php { include snippets/nott-intek-proxy.conf; }
    location = /nott/metaData.php    { include snippets/nott-intek-proxy.conf; }
    location = /nott/userinfo.php    { include snippets/nott-intek-proxy.conf; }
    location = /nott/cdn.php         { include snippets/nott-intek-proxy.conf; }

    # On cms1, `index index.html tokenServer.php ...` turns GET /nott/ into
    # /nott/tokenServer.php (with the query string): /var/www/html/nott has no
    # index.html (verified 2026-10-23).
    location = /nott/ { rewrite ^ /nott/tokenServer.php last; }

    # ---- posters: plain static files, as on cms1. nginx derives ETag and
    # Last-Modified from the file's size and mtime, so poster-sync preserves
    # mtimes (rsync -t) and the headers come out identical to cms1's.
    location /cms/posters/ {
        try_files $uri =404;
    }

    # ---- everything else: 404. Not carried over from cms1, on purpose:
    # stale scripts (tokenServer_old.php, cdn_og*.php, cdn_edited.php,
    # test.php), vim swap files, phpMyAdmin, and anything else in its webroot.
    # No box calls any of these (cms1 access log, 2026-10-23).
    location / {
        return 404;
    }
}


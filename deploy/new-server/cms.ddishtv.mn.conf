#   proxy_set_header Client-IP $http_client_ip;
#   # cdn.php request=response can make two 10 s calls (ordernOTT + billing)
#   proxy_read_timeout 60s;
#   # No automatic retry/fallback: a timed-out cdn.php may already have billed.
#   proxy_next_upstream off;
